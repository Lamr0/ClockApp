name: Build ClockApp (Windows)

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install MAUI workload
        run: dotnet workload install maui

      - name: Publish
        shell: pwsh
        run: |
          $proj = Get-ChildItem -Recurse -Filter ClockApp.csproj | Select-Object -First 1
          dotnet publish $proj.FullName -f net10.0-windows10.0.19041.0 -c Release -p:RuntimeIdentifierOverride=win-x64 -p:WindowsPackageType=None -p:WindowsAppSDKSelfContained=true

      - name: Zip
        shell: pwsh
        run: |
          $publish = Get-ChildItem -Recurse -Directory -Filter publish | Where-Object { $_.FullName -like '*win-x64*' } | Select-Object -First 1
          Compress-Archive -Path "$($publish.FullName)\*" -DestinationPath ClockApp-win-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ClockApp-win-x64
          path: ClockApp-win-x64.zip

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ClockApp-win-x64.zip
